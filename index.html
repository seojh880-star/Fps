</style></head><body>
<canvas id="c"></canvas><div id="pad"></div>
<div id="top"><span id="sr">0</span><span id="tm">3:00</span><span id="sb">0</span></div>

<div id="ov"><h1>블록 데스매치 5v5</h1><p id="mst" style="font-weight:700;font-size:20px"></p><p id="info">연결 중…</p><p id="lnk" style="font-size:14px;word-break:break-all;opacity:.85;max-width:420px"></p><p id="dbg" style="font-size:13px;opacity:.7;max-width:420px">build 4 · 서버 연결 중…</p><button id="go">게임 입장</button><p style="font-size:15px">⏱ 3분 경기 · 팀 전체 킬 수가 더 많은 팀이 승리<br>경기가 끝나면 결과가 나오고 자동으로 다음 경기가 시작돼요</p>
<p style="opacity:.7;font-size:14px">왼쪽 드래그: 이동 · 오른쪽 드래그: 시점 · 발사 버튼을 누른 채 드래그해도 조준돼요</p></div>

<script>
const T=THREE,$=i=>document.getElementById(i);

sc.add(new T.HemisphereLight(0xffffff,0x667788,1));

function rs(){ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
const L=c=>new T.MeshLambertMaterial({color:c});
const gr=new T.Mesh(new T.PlaneGeometry(92,92),L(0x6bbf59));gr.rotation.x=-Math.PI/2;sc.add(gr);
[[-40,0xef4444],[40,0x3b82f6]].forEach(([z,c])=>{const p=new T.Mesh(new T.PlaneGeometry(92,12),L(c));p.rotation.x=-Math.PI/2;p.position.set(0,.02,z);sc.add(p)});
const OB=[],obM=[];
function box(x,z,w,d,h,c){const m=new T.Mesh(new T.BoxGeometry(w,h,d),L(c));m.position.set(x,h/2,z);sc.add(m);m.updateMatrixWorld();OB.push({x,z,w,d,h});obM.push(m)}
box(0,-46,94,2,5,0x888888);box(0,46,94,2,5,0x888888);box(-46,0,2,94,5,0x888888);box(46,0,2,94,5,0x888888);
let sd=7;const rn=()=>(sd=sd*16807%2147483647)/2147483647;
const cl=[0xd9a441,0x9b6b43,0x8a8fa3,0xc9c27a];
for(let i=0;i<16;i++){const w=3+rn()*5,d=3+rn()*5,h=i%4===0?1.4:2.4+rn()*2,x=(rn()-.5)*70,z=(rn()-.5)*40;box(x,z,w,d,h,cl[i%4])}
function col(p){for(const o of OB){const hx=o.w/2+.5,hz=o.d/2+.5,dx=p.x-o.x,dz=p.z-o.z;
if(p.y<o.h-.2&&Math.abs(dx)<hx&&Math.abs(dz)<hz){const px=hx-Math.abs(dx),pz=hz-Math.abs(dz);if(px<pz)p.x+=Math.sign(dx||1)*px;else p.z+=Math.sign(dz||1)*pz}}}
function gh(p,y){let f=0;for(const o of OB)if(Math.abs(p.x-o.x)<o.w/2+.3&&Math.abs(p.z-o.z)<o.d/2+.3&&y>=o.h-.05)f=Math.max(f,o.h);return f}
// 아바타
function mkAv(tm,peer){const g=new T.Group(),c=tm?0x3b82f6:0xef4444;
const add=(w,h,d,y,col,hd,x=0)=>{const b=new T.Mesh(new T.BoxGeometry(w,h,d),L(col));b.position.set(x,y,0);b.userData={peer,hd};g.add(b)};
add(.8,.6,.4,.3,0x333355);add(1,.9,.5,1.05,c);add(.6,.6,.6,1.8,0xffd27a,1);add(.2,.2,.8,1.1,0x222222,0,.55);
g.children[3].position.z=-.5;return {g,tm}}
const av={};
// 상태
const me={x:0,y:0,z:0,vy:0,yaw:0,pit:0,hp:100,al:1,tm:0,k:0,d:0,started:0,c:-1};
const MT=180000,CY=195000;
function ph(){const n=Date.now(),c=Math.floor(n/CY),o=n%CY;return {c,pl:o<MT,rem:o<MT?MT-o:CY-o}}
const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let P=ph(),scr=[0,0];
function upRes(){$('mst').textContent=P.pl?`현재 경기 진행 중 · 남은 시간 ${fmt(P.rem)}`:`경기 종료 · 다음 경기까지 ${fmt(P.rem)}`;
if(!P.pl)$('tm').textContent='종료';
const r=$('res');if(me.started&&!P.pl){r.style.display='flex';const a=scr[0],b=scr[1];
$('rt').textContent=a>b?'🔴 빨강팀 승리!':b>a?'🔵 파랑팀 승리!':'무승부';$('rsc').textContent=`빨강 ${a} : ${b} 파랑`;
$('rme').textContent=`내 기록 K ${me.k} / D ${me.d} (${me.tm?'파랑':'빨강'}팀)`;$('rnx').textContent=`다음 경기까지 ${fmt(P.rem)}`}else r.style.display='none'}
let room=null,myP='',jx=0,jy=0,firing=0,last=0;
function spawn(){me.x=(Math.random()-.5)*60;me.z=me.tm?38:-38;me.yaw=me.tm?0:Math.PI;me.pit=0;me.y=0;me.vy=0;me.hp=100;me.al=1;$('dead').style.display='none'}
const gun=new T.Group();let kick=0;
const gp=(g,c,x,y,z,rx)=>{const m=new T.Mesh(g,L(c));m.position.set(x,y,z);if(rx)m.rotation.x=rx;gun.add(m);return m};
const bx=(w,h,d)=>new T.BoxGeometry(w,h,d);
gp(bx(.12,.15,.5),0x2b2f36,0,0,-.05);            // 리시버
gp(bx(.1,.09,.34),0x6b4a2b,0,-.01,-.45);          // 핸드가드(나무)
gp(new T.CylinderGeometry(.022,.022,.5,8),0x15171a,0,.03,-.78,Math.PI/2);  // 총열
gp(new T.CylinderGeometry(.034,.034,.1,8),0x15171a,0,.03,-1.03,Math.PI/2); // 소염기
gp(bx(.07,.2,.1),0x1c1c1c,0,-.16,.08,.3);         // 손잡이
gp(bx(.07,.24,.1),0x3d4047,0,-.18,-.2,-.25);      // 탄창
gp(bx(.09,.14,.3),0x6b4a2b,0,-.02,.35);           // 개머리판
gp(bx(.03,.06,.03),0x111111,0,.12,-.95);          // 가늠쇠
gp(bx(.1,.03,.05),0x111111,0,.095,-.1);           // 가늠자
const flash=gp(new T.SphereGeometry(.09,6,6),0xffd84a,0,.03,-1.12);flash.material=new T.MeshBasicMaterial({color:0xffd84a});flash.visible=false;
gun.position.set(.3,-.28,-.55);cam.add(gun);
const bul=[],BG=new T.CylinderGeometry(.03,.03,.9,5),BM=new T.MeshBasicMaterial({color:0xffe066});
// 멀티플레이

function mkRoom(){return new Promise(res=>{
const st=m=>{const e=document.getElementById('dbg');if(e)e.textContent='build 4 · '+m};
if(!window.Peer){st('PeerJS를 불러오지 못했어요 (콘텐츠 차단기·네트워크 확인)');res(null);return}
let code=(location.hash||'').slice(1).replace(/[^A-Za-z0-9]/g,'').slice(0,8).toUpperCase();
if(!code){code=Math.random().toString(36).slice(2,6).toUpperCase();location.hash=code}
const H={},conns={};let pres={},me=null,host=false,open=false,dirty=1,list=[],hc=null,done=0,tries=0;
const fin=v=>{if(!done){done=1;res(v)}};
const deliver=(f,t,d)=>(H[t]||[]).forEach(fn=>fn({peer:f,isMe:f===me,sameTab:f===me,topic:t,data:d}));
const bc=m=>{for(const id in conns)try{conns[id].send(m)}catch(e){}};
const merge=(id,p)=>{if(!p||typeof p!=='object')return;const q=pres[id]=pres[id]||{};for(const k in p){if(p[k]===null)delete q[k];else q[k]=p[k]}dirty=1};
const R={connected:()=>open,
on(t,f){(H[t]=H[t]||[]).push(f);return()=>{H[t]=H[t].filter(x=>x!==f)}},
emit(t,d){if(host){deliver(me,t,d);bc({t:'ev',f:me,p:t,d})}else if(hc&&open)try{hc.send({t:'ev',p:t,d})}catch(e){}return Promise.resolve()},
presence(p){merge(me,p);if(!host&&hc&&open)try{hc.send({t:'pr',p})}catch(e){}return Promise.resolve()},
peers(){if(dirty){list=Object.keys(pres).map(id=>({peer:id,isMe:id===me,sameTab:id===me,presence:pres[id]}));dirty=0}return list}};
function retry(why){if(open||done)return;if(tries>=6){st('연결 실패: '+why);fin(null);return}st('재시도 중… ('+why+')');setTimeout(attempt,3000)}
function join(){let to=null;const p=new Peer();
p.on('error',e=>{if(!open){clearTimeout(to);try{p.destroy()}catch(x){}retry(e.type)}});
p.on('open',id=>{me=id;pres={};pres[me]={};dirty=1;
const c=hc=p.connect('fpsdm-'+code,{reliable:true,serialization:'json'});
to=setTimeout(()=>{if(!open){try{p.destroy()}catch(x){}retry('방장 응답 없음')}},9000);
c.on('open',()=>{clearTimeout(to);open=true;st('방에 접속했어요 · 코드 '+code);fin(R)});
c.on('data',m=>{if(!m)return;if(m.t==='ev')deliver(m.f,m.p,m.d);else if(m.t==='ps'&&m.a){const mine=pres[me];pres=Object.assign({},m.a);pres[me]=mine;dirty=1}});
c.on('close',()=>{open=false;st('연결이 끊겼어요 (방장이 나갔을 수 있어요)')});c.on('error',()=>{open=false})})}
function attempt(){if(done)return;tries++;st('연결 시도 '+tries+'…');
const pc=new Peer('fpsdm-'+code);
pc.on('error',e=>{if(e.type==='unavailable-id'){try{pc.destroy()}catch(x){}join()}else if(!open){try{pc.destroy()}catch(x){}retry(e.type)}});
pc.on('disconnected',()=>{try{pc.reconnect()}catch(x){}});
pc.on('open',id=>{me=id;host=true;open=true;pres={};pres[me]={};dirty=1;st('방장으로 방을 만들었어요 · 코드 '+code);fin(R);
setInterval(()=>bc({t:'ps',a:pres}),66)});
pc.on('connection',c=>{
const drop=()=>{if(conns[c.peer]){delete conns[c.peer];delete pres[c.peer];dirty=1}};
c.on('open',()=>{if(Object.keys(conns).length>=9){c.close();return}conns[c.peer]=c;pres[c.peer]={};dirty=1;st('방장 · 접속한 친구 '+Object.keys(conns).length+'명 · 코드 '+code)});
c.on('data',m=>{if(!m||!conns[c.peer])return;if(m.t==='ev'&&typeof m.p==='string'){deliver(c.peer,m.p,m.d);bc({t:'ev',f:c.peer,p:m.p,d:m.d})}else if(m.t==='pr')merge(c.peer,m.p)});
c.on('close',drop);c.on('error',drop)})}
attempt()})}
(async()=>{try{room=await mkRoom()}catch(e){}
if(!room){$('lnk').textContent='서버에 연결하지 못했어요';return}
$('lnk').textContent='친구에게 이 주소를 그대로 보내세요: '+location.href;
room.on('shot',m=>{if(m.isMe)return;const d=m.data;if(d&&d.a&&d.b)tracer(d.a,d.b)});
room.on('hit',m=>{const d=m.data;if(d&&d.to===myP&&me.al&&me.started)dmg(+d.dm||25,m.peer)});
room.on('kill',m=>{const d=m.data;if(!d)return;const n=s=>String(s).slice(-4);
const e=document.createElement('div');e.textContent=n(d.k)+' ▶ '+n(m.peer);$('feed').appendChild(e);setTimeout(()=>e.remove(),5000);
if(d.k===myP&&!m.isMe&&P.pl)me.k++});
})();
const snd=(t,d)=>{if(room)room.emit(t,d).catch(()=>{})};
function dmg(n,from){if(!P.pl)return;me.hp-=n;$('flash').style.opacity=.5;setTimeout(()=>$('flash').style.opacity=0,120);
if(me.hp<=0&&me.al){me.hp=0;me.al=0;me.d++;snd('kill',{k:from});$('dead').style.display='flex';setTimeout(spawn,3000)}}
function tracer(a,b){const A=new T.Vector3(...a),d=new T.Vector3(...b).sub(A),L2=d.length();if(!(L2>.5))return;d.normalize();
const m=new T.Mesh(BG,BM);m.position.copy(A);m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d);sc.add(m);bul.push({m,A,dir:d,L:L2,t:0})}
const rc=new T.Raycaster();
function fire(){const t=performance.now();if(t-last<170||!me.al||!me.started||!P.pl)return;last=t;
const o=new T.Vector3(),d=new T.Vector3();cam.getWorldPosition(o);cam.getWorldDirection(d);rc.set(o,d);rc.far=120;
const w=rc.intersectObjects(obM),wd=w.length?w[0].distance:120;
const en=Object.values(av).filter(a=>a.g.visible&&a.tm!==me.tm).map(a=>a.g);
const h=rc.intersectObjects(en,true);let end=o.clone().addScaledVector(d,wd);
if(h.length&&h[0].distance<wd){end=h[0].point;const u=h[0].object.userData;snd('hit',{to:u.peer,dm:u.hd?50:25});
$('cross').className='h';setTimeout(()=>$('cross').className='',120)}
const a=[o.x+Math.cos(me.yaw)*.3+d.x*.9,o.y-.25+d.y*.9,o.z-Math.sin(me.yaw)*.3+d.z*.9].map(v=>+v.toFixed(2)),b=[end.x,end.y,end.z].map(v=>+v.toFixed(2));
tracer(a,b);snd('shot',{a,b});kick=1;flash.visible=true;setTimeout(()=>flash.visible=false,50)}
// 터치 조작
const pad=$('pad');let st=null,lk=null;
const look=(dx,dy)=>{me.yaw-=dx*.006;me.pit=Math.max(-1.3,Math.min(1.3,me.pit-dy*.006))};
pad.addEventListener('pointerdown',e=>{e.preventDefault();
if(e.clientX<innerWidth*.45&&!st){st={id:e.pointerId,x:e.clientX,y:e.clientY};const s=$('stick');s.style.display='block';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';$('kn').style.transform=''}
else if(!lk)lk={id:e.pointerId,x:e.clientX,y:e.clientY}});
pad.addEventListener('pointermove',e=>{
if(st&&e.pointerId===st.id){let dx=e.clientX-st.x,dy=e.clientY-st.y;const l=Math.hypot(dx,dy),m=55;if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=dy/m;$('kn').style.transform=`translate(${dx}px,${dy}px)`}
else if(lk&&e.pointerId===lk.id){look(e.clientX-lk.x,e.clientY-lk.y);lk.x=e.clientX;lk.y=e.clientY}});
const up=e=>{if(st&&e.pointerId===st.id){st=null;jx=jy=0;$('stick').style.display='none'}if(lk&&e.pointerId===lk.id)lk=null};
pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
const fb=$('fire');let fl=null;
fb.addEventListener('pointerdown',e=>{e.preventDefault();firing=1;fl={id:e.pointerId,x:e.clientX,y:e.clientY}});
fb.addEventListener('pointermove',e=>{if(fl&&e.pointerId===fl.id){look(e.clientX-fl.x,e.clientY-fl.y);fl.x=e.clientX;fl.y=e.clientY}});
const fu=()=>{firing=0;fl=null};fb.addEventListener('pointerup',fu);fb.addEventListener('pointercancel',fu);
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(me.gr&&me.al)me.vy=11});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
$('go').onclick=()=>{const n=[0,0];if(room)for(const p of room.peers())if(!p.isMe&&p.presence.tm!==undefined)n[p.presence.tm]++;
if(n[0]+n[1]>=10){$('info').textContent='방이 가득 찼어요 (10/10)';return}
me.tm=n[0]<n[1]?0:n[1]<n[0]?1:(Math.random()<.5?0:1);me.started=1;me.k=me.d=0;me.c=P.c;spawn();$('ov').style.display='none';
$('hud').style.color=me.tm?'#8ab8ff':'#ff9a9a'};
$('rb').onclick=()=>{me.started=0;me.al=1;firing=0;$('res').style.display='none';$('ov').style.display='flex';if(room)room.presence({tm:null,al:null}).catch(()=>{})};
const K={};
// 루프
let lt=performance.now(),ps=0,hu=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-lt)/1000,.05);lt=t;
const peers=room?room.peers():[];
P=ph();if(me.c!==P.c){me.c=P.c;me.k=me.d=0;if(me.started)spawn()}
if(!myP){const m=peers.find(p=>p.sameTab);if(m)myP=m.peer}
